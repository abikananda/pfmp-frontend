<div class="layout">
  <!-- Sidebar Navigation -->
  <app-navigation
    class="pcoded-navbar menupos-fixed menu-light"
    [ngClass]="{ 'navbar-collapsed': navCollapsed, 'mob-open': navCollapsedMob }"
    (NavCollapsedMob)="navMobClick()"
  ></app-navigation>

  <div class="main-container">
    <!-- Header Bar -->
    <app-nav-bar
      class="navbar pcoded-header navbar-expand-lg navbar-light header-blue headerPos-fixed"
      (NavCollapse)="this.navCollapsed = !this.navCollapsed"
      (NavCollapsedMob)="navMobClick()"
    ></app-nav-bar>

    <!-- Main Content Area -->
    <div class="page-wrapper">
      <app-breadcrumb></app-breadcrumb>
      <router-outlet></router-outlet>
    </div>
  </div>

  <!-- Mobile overlay for closing menu -->
  <div
    class="pc-menu-overlay"
    (click)="closeMenu()"
    (keydown)="handleKeyDown($event)"
    tabindex="0"
  ></div>
</div>
