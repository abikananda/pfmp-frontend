<div class="auth-wrapper">
  <!-- [ change-password ] start -->
  <div class="auth-content">
    <div class="card">
      <div class="row align-items-center text-center">
        <div class="col-md-12">
          <form name="form" (ngSubmit)="f.form.valid && onSubmit()" #f="ngForm" novalidate>
            <div class="card-body">
              <img src="assets/images/logo.svg" alt="" class="img-fluid mb-4">
              <h4 class="mb-4 f-w-400">Change your password</h4>
              <div class="form-group">
                <div class="input-group">
                  <span class="input-group-text"><i class="feather icon-lock"></i></span>
                  <input type="password" class="form-control" name="current_password" placeholder="Current Password"
                    [(ngModel)]="form['current_password']" #current_password="ngModel" required minlength="6">
                </div>
                <div *ngIf="f.submitted && current_password.invalid" class="text-danger txt-validation">
                  <div *ngIf="current_password.errors?.['required']">required</div>
                  <div *ngIf="current_password.errors?.['minlength']">must be at least 6 characters</div>
                </div>
              </div>
              <div class="form-group">
                <div class="input-group">
                  <span class="input-group-text"><i class="feather icon-lock"></i></span>
                  <input type="password" class="form-control" name="new_password" placeholder="New Password"
                    [(ngModel)]="form['new_password']" #new_password="ngModel" required minlength="6">
                </div>
                <div *ngIf="f.submitted && new_password.invalid" class="text-danger txt-validation">
                  <div *ngIf="new_password.errors?.['required']">required</div>
                  <div *ngIf="new_password.errors?.['minlength']">must be at least 6 characters</div>
                </div>
              </div>
              <div class="form-group">
                <div class="input-group">
                  <span class="input-group-text"><i class="feather icon-lock"></i></span>
                  <input type="password" class="form-control" name="retype_password" placeholder="Re-Type New Password"
                    [(ngModel)]="form['retype_password']" #retype_password="ngModel" required minlength="6">
                </div>
                <div *ngIf="f.submitted && retype_password.invalid" class="text-danger txt-validation">
                  <div *ngIf="retype_password.errors?.['required']">required</div>
                  <div *ngIf="retype_password.errors?.['minlength']">must be at least 6 characters</div>
                </div>
              </div>
              <div class="form-group">
                <div *ngIf="f.submitted && isSignUpFailed" class="alert alert-warning">
                  Signup failed!<br />{{errorMessage}}
                </div>
              </div>
              <button class="btn btn-block btn-primary mb-4">Change password</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <!-- [ change-password ] end -->
</div>
