<div class="auth-wrapper">
  <!-- [ reset-password ] start -->
  <div class="auth-content">
    <div class="card">
      <div class="row align-items-center text-center">
        <div class="col-md-12">
          <form name="form" (ngSubmit)="f.form.valid && onSubmit()" #f="ngForm" novalidate>
            <div class="card-body">
              <img src="assets/images/logo.svg" alt="" class="img-fluid mb-4">
              <h4 class="mb-3 f-w-400">Reset your password</h4>
              <div class="form-group">
                <div class="input-group">
                  <span class="input-group-text"><i class="feather icon-mail"></i></span>
                  <input type="email" class="form-control" placeholder="Email address" name="email"
                    placeholder="Email address" [(ngModel)]="form['email']" #email="ngModel" required email>
                </div>
                <div *ngIf="f.submitted && email.invalid" class="text-danger txt-validation">
                  <div *ngIf="email.errors?.['required']">Email is required</div>
                  <div *ngIf="email.errors?.['email']">Email must be a valid email address</div>
                </div>
              </div>
              <div class="form-group">
                <div *ngIf="f.submitted && isSignUpFailed" class="alert alert-warning">
                  Signup failed!<br />{{errorMessage}}
                </div>
              </div>
              <button class="btn btn-block btn-primary mb-4">Reset password</button>
              <p class="mb-0 text-muted">Don’t have an account? <a [routerLink]="['/app/auth/signup']"
                  class="f-w-400">Signup</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <!-- [ reset-password ] end -->
</div>
