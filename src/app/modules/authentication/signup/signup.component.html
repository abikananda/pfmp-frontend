<div class="auth-wrapper">
  <div class="auth-content">
    <div class="card">
      <div class="row align-items-center text-center">
        <div class="col-md-12">
          <form name="form" (ngSubmit)="f.form.valid && onSubmit()" #f="ngForm" novalidate>
            <div class="card-body">
              <img src="assets/images/logo.svg" alt="" class="img-fluid mb-4">
              <h4 class="mb-3 f-w-400">Sign up</h4>
              <div class="form-group">
                <div class="input-group">
                  <span class="input-group-text"><i class="feather icon-user"></i></span>
                  <input type="text" class="form-control" placeholder="Name" name="name" [(ngModel)]="form['name']"
                    #name="ngModel" required>
                </div>
                <div *ngIf="f.submitted && name.invalid" class="text-danger txt-validation">
                  <div *ngIf="name.errors?.['required']">Name is required</div>
                </div>
              </div>
              <div class="form-group">
                <div class="input-group">
                  <span class="input-group-text"><i class="feather icon-user"></i></span>
                  <input type="text" class="form-control" placeholder="Username" name="username"
                    [(ngModel)]="form['username']" #username="ngModel" required>
                </div>
                <div *ngIf="f.submitted && username.invalid" class="text-danger txt-validation">
                  <div *ngIf="username.errors?.['required']">Username is required</div>
                </div>
              </div>
              <div class="form-group">
                <div class="input-group">
                  <span class="input-group-text"><i class="feather icon-mail"></i></span>
                  <input type="email" class="form-control" name="email" placeholder="Email address"
                    [(ngModel)]="form['email']" #email="ngModel" required email>
                </div>
                <div *ngIf="f.submitted && email.invalid" class="text-danger txt-validation">
                  <div *ngIf="email.errors?.['required']">Email is required</div>
                  <div *ngIf="email.errors?.['email']">Email must be a valid email address</div>
                </div>
              </div>
              <div class="form-group">
                <div class="input-group">
                  <span class="input-group-text"><i class="feather icon-lock"></i></span>
                  <input type="password" class="form-control" name="password" placeholder="Password"
                    [(ngModel)]="form['password']" #password="ngModel" required minlength="6">
                </div>
                <div *ngIf="f.submitted && password.invalid" class="text-danger txt-validation">
                  <div *ngIf="password.errors?.['required']">Password is required</div>
                  <div *ngIf="password.errors?.['minlength']">Password must be at least 6 characters</div>
                </div>
              </div>
              <div class="form-group">
                <div *ngIf="f.submitted && isSignUpFailed" class="alert alert-danger text-danger">
                  {{errorMessage}}
                </div>
              </div>
              <button class="btn btn-primary btn-block mb-4">Sign up</button>
              <p class="mb-2">Already have an account? <a [routerLink]="['/app/auth/signin']" class="f-w-400">Signin</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
