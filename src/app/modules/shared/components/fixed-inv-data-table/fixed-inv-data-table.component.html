<form>
    <div class="mb-3 d-flex flex-nowrap justify-content-between align-items-center" style="white-space: nowrap;">
        <div class="d-flex align-items-center flex-grow-1 me-3">
            <label for="table-complete-search" class="me-2 col-form-label">Search:</label>
            <input id="table-complete-search" type="text" class="form-control me-2 w-auto" 
                name="searchTerm" placeholder="Search" [(ngModel)]="service.searchTerm" style="min-width: 200px;" />
            <span *ngIf="service.loading$ | async" class="col-form-label">Loading...</span>
        </div>
    
        <div class="d-flex align-items-center flex-nowrap">
            <div class="form-check form-switch mb-3">
                <input class="form-check-input"
                       type="checkbox"
                       id="statusToggle"
                       name="statusToggle"
                       [(ngModel)]="showOnlyActive"
                       (change)="filterItems()" />
                <label class="form-check-label" for="statusToggle">
                  Show Only Active
                </label>
              </div>
              
        </div>
    </div>
    <table class="table table-striped">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col" appSortable [column]="'particular'" (sort)="onSort($event)">Particulars</th>
                <th scope="col" appSortable [column]="'invAmount'" (sort)="onSort($event)">Investment Amount</th>
                <!-- <th scope="col" appSortable [column]="'otherIncome'" (sort)="onSort($event)">Other Income</th> -->
                <th scope="col" appSortable [column]="'invWeight'" (sort)="onSort($event)">Weight(Wi)</th>
                <th scope="col" appSortable [column]="'invReturn'" (sort)="onSort($event)">Returns(Ri)</th>
                <th scope="col" appSortable [column]="'weightWithReturn'" (sort)="onSort($event)">WiRi</th>
                <th scope="col" appSortable [column]="'investmentStatus'" (sort)="onSort($event)">Investment Status</th>
                <th scope="col" appSortable [column]="'maturityDate'" (sort)="onSort($event)" [hidden]="hideColumn()">Maturity Date</th>
                <th scope="col" appSortable [column]="'comments'" (sort)="onSort($event)">Comments</th>
            </tr>
        </thead>
        <tbody>
            @for (country of countries$ | async; track country.id) {
            <tr>
                <th scope="row">{{ country.id }}</th>
                <td><ngb-highlight [result]="country.particular" [term]="service.searchTerm" /></td>
                <td><ngb-highlight [result]="country.invAmount | currency: 'INR':'symbol':'1.1-2':'hi-IN'" [term]="service.searchTerm" />
                </td>
                <!-- <td><ngb-highlight [result]="country.otherIncome | currency: 'INR':'symbol':'1.1-2':'hi-IN'" [term]="service.searchTerm" />
                </td> -->
                <td><ngb-highlight [result]="country.invWeight | number" [term]="service.searchTerm" /></td>
                <!-- divide by 100 because percent pipe multiply value with 100 by default -->
                <td><ngb-highlight [result]="country.invReturn/100 | percent: '1.1-2'" [term]="service.searchTerm" />
                </td>
                <td><ngb-highlight [result]="country.weightWithReturn/100 | percent: '1.1-2'"
                        [term]="service.searchTerm" /></td>
                <td><ngb-highlight [result]="country.investmentStatus" [term]="service.searchTerm" /></td>
                <td [hidden]="hideColumn()"><ngb-highlight [result]="country.maturityDate" [term]="service.searchTerm" /></td>
                <td><ngb-highlight [result]="country.comments" [term]="service.searchTerm" /></td>
            </tr>
            } @empty {
            <tr>
                <td colspan="8" style="text-align: center">No Investment found</td>
            </tr>
            }
        </tbody>
    </table>

    <div class="d-flex justify-content-between p-2">
        <ngb-pagination [collectionSize]="(total$ | async)!" [(page)]="service.page" [pageSize]="service.pageSize">
        </ngb-pagination>

        <select class="form-select" style="width: auto" name="pageSize" [(ngModel)]="service.pageSize">
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
            <option [ngValue]="50">50</option>
            <option [ngValue]="100">100</option>
        </select>
    </div>
</form>
